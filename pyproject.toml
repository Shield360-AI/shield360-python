[tool.poetry]
name = "shield360"
version = "1.2.0"
description = "OpenTelemetry-native Auto instrumentation library for monitoring LLM Applications and GPUs, facilitating the integration of observability into your GenAI-driven projects"
authors = ["Shield360 <developer@shield360.ai>"]
license = "Apache-2.0"
repository = "https://github.com/Shield360-AI/shield360-python"
readme = "README.md"
homepage = "https://github.com/Shield360-AI/shield360-python"
keywords = ["OpenTelemetry", "otel", "otlp","llm", "tracing", "openai", "anthropic", "claude", "cohere", "llm monitoring", "observability", "monitoring", "gpt", "Generative AI", "chatGPT", "gpu"]

packages = [
  { include = "shield360", from = "src" }
]
# SHIELD: the OpenLIT / OpenRASP / Cisco attributions (Apache-2.0 section 4(d)).
include = [{ path = "NOTICE", format = "sdist" }]

[tool.poetry.dependencies]
python = "^3.10.0"
requests = "^2.33.0"
urllib3 = ">=2.7.0,<3"
schedule = "^1.2.2"
pydantic = "^2.0.0"
xmltodict = ">=0.13.0,<2.0.0"
boto3 = "^1.34.0"
botocore = "^1.34.0"
opentelemetry-api = ">=1.38.0,<2.0.0"
opentelemetry-sdk = ">=1.38.0,<2.0.0"
opentelemetry-exporter-otlp = ">=1.38.0,<2.0.0"
opentelemetry-semantic-conventions = ">=0.59b0,<1.0.0"
opentelemetry-instrumentation = ">=0.52b0,<1.0.0"
# Official OpenTelemetry HTTP Framework instrumentations
opentelemetry-instrumentation-asgi = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-django = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-fastapi = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-flask = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-pyramid = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-starlette = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-falcon = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-tornado = ">=0.52b0,<1.0.0"
# Official OpenTelemetry HTTP Client instrumentations
opentelemetry-instrumentation-aiohttp-client = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-httpx = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-requests = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-urllib = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-urllib3 = ">=0.52b0,<1.0.0"
# SHIELD: data stores, messaging and cloud: an app's requests show what they wait on
opentelemetry-instrumentation-sqlalchemy = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-asyncpg = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-psycopg2 = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-pymysql = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-mysqlclient = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-pymongo = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-redis = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-celery = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-grpc = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-botocore = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-kafka-python = ">=0.52b0,<1.0.0"
opentelemetry-instrumentation-confluent-kafka = ">=0.52b0,<1.0.0"
# Official OpenTelemetry System Metrics (optional)
opentelemetry-instrumentation-system-metrics = {version = ">=0.52b0,<1.0.0", optional = true}
openai = ">=1.92.0,<4.0.0"
anthropic = ">=0.42.0,<2.0.0"
# Agent passports (shield360.agents): Ed25519 verification
cryptography = {version = ">=42.0.0", optional = true}

[tool.poetry.extras]
agents = ["cryptography"]

[tool.poetry.scripts]
shield360-instrument = "shield360.cli.main:run"

[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"
